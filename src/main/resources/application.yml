server:
  port: ${PUERTO}
  shutdown: graceful

spring:
  application:
    name: uco-kudos-backend
  config:
    import: optional:file:.env[.properties]
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${BD_HOST}:${BD_PUERTO}/${BD_NOMBRE}?sslmode=${BD_SSLMODE:prefer}
    username: ${BD_USUARIO}
    password: ${BD_CLAVE}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${BD_ESQUEMA:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PUERTO}
      password: ${REDIS_CLAVE:}
      ssl:
        enabled: ${REDIS_SSL:false}
  mail:
    host: ${CORREO_HOST}
    port: ${CORREO_PUERTO}
    username: ${CORREO_USUARIO:}
    password: ${CORREO_CLAVE:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  servlet:
    multipart:
      max-file-size: ${ARCHIVOS_TAMANO_MAXIMO}
      max-request-size: ${ARCHIVOS_TAMANO_TOTAL_MAXIMO:26214400}

kudos:
  archivos:
    carpeta: ${ARCHIVOS_CARPETA}
    tamano-maximo-en-bytes: ${ARCHIVOS_TAMANO_MAXIMO}
    tipos-permitidos: ${ARCHIVOS_TIPOS_PERMITIDOS}
    cantidad-maxima: ${ARCHIVOS_CANTIDAD_MAXIMA:5}
  cache:
    segundos-de-vida: ${CACHE_SEGUNDOS}
  correo:
    remitente: ${CORREO_REMITENTE}
  whatsapp:
    url-base: ${WHATSAPP_URL_BASE:https://api.twilio.com}
    ruta-envio: ${WHATSAPP_RUTA_ENVIO:/2010-04-01/Accounts/{cuenta}/Messages.json}
    prefijo: ${WHATSAPP_PREFIJO:whatsapp:}
    cuenta-sid: ${WHATSAPP_CUENTA_SID:}
    token: ${WHATSAPP_TOKEN:}
    numero-origen: ${WHATSAPP_NUMERO_ORIGEN:}
  cola:
    nombre: ${COLA_NOMBRE:cola:notificaciones}
    intentos-maximos: ${COLA_INTENTOS:3}
    espera-base-en-segundos: ${COLA_ESPERA_BASE:2}
    canales: ${COLA_CANALES:${CANAL_CORREO:correo},${CANAL_WHATSAPP:whatsapp},${CANAL_PUSH:push}}
  cors:
    origenes-permitidos: ${CORS_ORIGENES:*}
  canales:
    correo: ${CANAL_CORREO:correo}
    whatsapp: ${CANAL_WHATSAPP:whatsapp}
    push: ${CANAL_PUSH:push}
  strapi:
    url-base: ${STRAPI_URL:http://localhost:1337}
    token: ${STRAPI_TOKEN:}
    mensajes:
      ruta: ${STRAPI_RUTA_MENSAJES:/api/mensajes}
      campo-codigo: ${STRAPI_CAMPO_CODIGO:codigo}
      campo-texto: ${STRAPI_CAMPO_TEXTO:texto}
    notificaciones:
      ruta: ${STRAPI_RUTA_NOTIFICACIONES:/api/notificaciones}
      campo-canal: ${STRAPI_CAMPO_CANAL:canal}
      campo-asunto: ${STRAPI_CAMPO_ASUNTO:asunto}
      campo-cuerpo: ${STRAPI_CAMPO_CUERPO:cuerpo}
  cuentas:
    dominio-correo: ${CORREO_DOMINIO:uco.net.co}
    digitos-documento: ${CORREO_DIGITOS_DOCUMENTO:4}
    longitud-clave-temporal: ${CLAVE_TEMPORAL_LONGITUD:10}
    segundos-de-sesion: ${SESION_SEGUNDOS:28800}
    prefijo-sesion: ${SESION_PREFIJO:sesion:}
    administrador-nombre: ${ADMIN_NOMBRE}
    administrador-correo: ${ADMIN_CORREO}
    administrador-telefono: ${ADMIN_TELEFONO:}
    administrador-clave: ${ADMIN_CLAVE}
    plantilla-solicitud: ${PLANTILLA_SOLICITUD:cuenta-solicitud}
    plantilla-aprobada: ${PLANTILLA_APROBADA:cuenta-aprobada}
    plantilla-rechazada: ${PLANTILLA_RECHAZADA:cuenta-rechazada}
    plantilla-aprobada-whatsapp: ${PLANTILLA_APROBADA_WHATSAPP:cuenta-aprobada-whatsapp}
